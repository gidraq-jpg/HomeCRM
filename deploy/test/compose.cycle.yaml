# Только для теста полного круга копий (deploy/test/backup-cycle.ps1), в своём compose-проекте homecrm-test-*.
# Вместо Яндекс Диска — rclone-подключение типа local: папка ${HOMECRM_DATA}/cloud монтируется как /cloud,
# так проверяется весь путь restic -> rclone -> «облако» без настоящих ключей.
services:
  migrate:
    volumes:
      - ${HOMECRM_DATA}/cloud:/cloud
  backup:
    volumes:
      - ${HOMECRM_DATA}/cloud:/cloud
  ops:
    volumes:
      - ${HOMECRM_DATA}/cloud:/cloud
