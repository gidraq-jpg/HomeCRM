# Одноразовая PostgreSQL 18 для тестов пакета db (ADR-0013). Её поднимает и удаляет
# src/testing/postgres.ts как compose-проект homecrm-test-<ветка>: рабочее окружение
# (проект homecrm) и чужие worktree не затрагиваются.
#
# Порт случайный и только на 127.0.0.1, данные — в памяти. Вход без пароля: контейнер живёт
# один прогон, снаружи недоступен, а в базе только вымышленная семья.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    # Надёжность записи тестам не нужна, скорость — нужна.
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # По TCP: на время первичной настройки образ слушает только локальный сокет.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 1s
      timeout: 3s
      retries: 60
