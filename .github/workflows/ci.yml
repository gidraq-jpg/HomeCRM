name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Бесплатный тариф даёт 2000 минут в месяц: устаревшие прогоны отменяются.
concurrency:
  # Явно запрошенные независимые прогоны не отменяют друг друга.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Одноразовая PostgreSQL 18 для тестов пакета db и матрицы доступа (ADR-0004, ADR-0013).
    # Пароль не нужен: контейнер живёт один прогон и доступен только внутри этого задания.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --tmpfs /var/lib/postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
      - name: Замеры скорости · p95 ≤ 300 мс · один worker
        run: pnpm test:perf
        env:
          HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres

  auth-screens:
    name: Вход · 360 и 412 px · axe
    runs-on: ubuntu-latest
    # Общий e2e и подготовка контейнера: запас для нагрузки runner. Матрица форм 200%/клавиатура — отдельно в compose UI-7.
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --tmpfs /var/lib/postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Checkout доверяет каталогу во временных настройках; prepare вызывает git из обычных.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @homecrm/web test:e2e:auth
        env:
          HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@postgres:5432/postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auth-screens-360-412
          path: apps/web/test-results
          if-no-files-found: error
          retention-days: 14
