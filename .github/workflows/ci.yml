name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Бесплатный тариф даёт 2000 минут в месяц: устаревшие прогоны отменяются.
concurrency:
  # Явно запрошенные независимые прогоны не отменяют друг друга.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  # Прогон main не отменяется следующим push: иначе push документов сразу после слияния
  # оставил бы слитый код без полной проверки (ADR-0019, 27 октября 2026).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Чтобы узнать, прошёл ли уже запрос на слияние те же файлы (ADR-0019, 27 октября 2026).
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Выбор проверок · кодировка
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:encoding
      - run: node --test scripts/select-checks.test.ts
      - name: Выбрать проверки по изменённым путям
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/select-checks.ts ci "$BASE" "$HEAD"
      - name: Только документы · проверить формат
        if: steps.changes.outputs.docs_only == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/select-checks.ts docs "$BASE" "$HEAD"
          echo 'Только документы: кодировка и формат проверены; тяжёлые проверки не требуются.' >> "$GITHUB_STEP_SUMMARY"
      # После слияния в main полный прогон не повторяется, если дерево файлов коммита совпадает
      # с головой запроса на слияние, чей CI уже зелёный: проверено ровно это содержимое.
      - name: Слияние уже проверено в запросе на слияние?
        id: verified
        if: github.event_name == 'push' && steps.changes.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=false
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)
          if [ -n "$pr" ] && git fetch --quiet origin "refs/pull/$pr/head"; then
            head=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$(git rev-parse "$head^{tree}")" ]; then
              ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success" --jq '.total_count' || echo 0)
              if [ "${ok:-0}" -gt 0 ]; then verified=true; fi
            fi
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          if [ "$verified" = true ]; then
            echo "Содержимое уже прошло полный CI в запросе на слияние #$pr: тяжёлые проверки не повторяются." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Полный прогон: содержимое не совпадает с проверенным запросом на слияние.'
          fi

  check-full:
    name: Полные проверки · Vitest и p95
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Одноразовая PostgreSQL 18 для тестов пакета db и матрицы доступа (ADR-0004, ADR-0013).
    # Пароль не нужен: контейнер живёт один прогон и доступен только внутри этого задания.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --tmpfs /var/lib/postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
      - name: Замеры скорости · p95 ≤ 300 мс · один worker
        run: pnpm test:perf
        env:
          HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres

  auth-shards:
    name: Браузерные сценарии · часть ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # У каждой части свой runner, PostgreSQL и свободные порты серверов сценариев.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --tmpfs /var/lib/postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Checkout доверяет каталогу во временных настройках; prepare вызывает git из обычных.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @homecrm/web test:e2e:auth --shard=${{ matrix.shard }}/3
        env:
          HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@postgres:5432/postgres
          HOMECRM_E2E_GROUP_STUDIO: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auth-screens-360-412-shard-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: error
          retention-days: 14

  check:
    name: pnpm check
    needs: [changes, check-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Проверить итог
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
          FULL: ${{ needs.check-full.result }}
        run: |
          test "$CHANGES" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$FULL" = skipped
            echo 'Только документы: кодировка и формат проверены.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VERIFIED" = true ]; then
            test "$FULL" = skipped
            echo 'Проверено в запросе на слияние.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$FULL" = success
          fi

  auth-screens:
    name: Вход · 360 и 412 px · axe
    needs: [changes, auth-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Проверить все три части
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
          SHARDS: ${{ needs.auth-shards.result }}
        run: |
          test "$CHANGES" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$SHARDS" = skipped
            echo 'Только документы: браузерные сценарии не требуются, кодировка и формат проверены.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VERIFIED" = true ]; then
            test "$SHARDS" = skipped
            echo 'Браузерные сценарии пройдены в запросе на слияние.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$SHARDS" = success
          fi
