<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: экранная клавиатура сжимает страницу, и панели с формами остаются над ней -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#20201e" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>HomeCRM</title>
    <style>
      /* Заставка рисуется до запуска React. Геометрия знака совпадает со StudioBrand. */
      @font-face {
        font-family: "Onest Splash";
        src: url("@fontsource/onest/files/onest-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #20201e;
      }
      .boot-logo {
        --mark-size: clamp(38px, 14.86vw, 52px);
        display: flex;
        align-items: center;
        gap: 0.17em;
        color: #eee9df;
        font: 500 calc(var(--mark-size) * 0.60) / 1 "Onest Splash", "Segoe UI", sans-serif;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .boot-mark {
        display: block;
        width: var(--mark-size);
        height: auto;
      }
      .boot-mark,
      .boot-dot {
        color: #ec8a62;
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-mark {
          animation: boot-appear 200ms linear(0, 0.13, 0.29, 0.54, 0.72, 0.85, 1) 167ms both;
        }
        .boot-logo {
          animation: boot-align 300ms cubic-bezier(0.18, 0, 0.38, 0.94) 900ms both;
        }
        .boot-word {
          transform-origin: right center;
          animation:
            boot-appear 200ms cubic-bezier(0.37, 0.04, 0, 0.41) 900ms both,
            boot-expand 270ms cubic-bezier(0.26, 0.18, 0.28, 1) 900ms both;
        }
        [data-state="closing"] .boot-stage {
          animation:
            boot-blur 820ms linear both,
            boot-dissolve 820ms both,
            boot-grow 820ms ease-out both;
        }
        @keyframes boot-appear {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes boot-align {
          from { transform: translateX(calc((100% - var(--mark-size)) / 2)); }
          to { transform: translateX(0); }
        }
        @keyframes boot-expand {
          from { transform: scale(0.5); }
          to { transform: scale(1); }
        }
        @keyframes boot-blur {
          from { filter: blur(0); }
          to { filter: blur(calc(clamp(38px, 14.86vw, 52px) * 0.56)); }
        }
        @keyframes boot-dissolve {
          from { opacity: 1; }
          96% { opacity: 0.68; }
          to { opacity: 0; }
        }
        @keyframes boot-grow {
          from { transform: scale(1); }
          to { transform: scale(1.08); }
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-stage">
        <div class="boot-logo">
          <svg class="boot-mark" viewBox="0 0 15 13" aria-hidden="true">
            <path
              d="M7.07926 0.222253C7.31275 -0.007434 7.6873 -0.007434 7.92079 0.222253L14.6708 6.86227C14.907 7.09465 14.9101 7.47453 14.6778 7.71076C14.4454 7.947 14.0655 7.95012 13.8293 7.71773L13 6.90201V12.5C13 12.7761 12.7762 13 12.5 13H2.50002C2.22388 13 2.00002 12.7761 2.00002 12.5V6.90201L1.17079 7.71773C0.934558 7.95012 0.554672 7.947 0.32229 7.71076C0.0899079 7.47453 0.0930283 7.09465 0.32926 6.86227L7.07926 0.222253ZM7.50002 1.49163L12 5.91831V12H10V8.49999C10 8.22385 9.77617 7.99999 9.50002 7.99999H6.50002C6.22388 7.99999 6.00002 8.22385 6.00002 8.49999V12H3.00002V5.91831L7.50002 1.49163ZM7.00002 12H9.00002V8.99999H7.00002V12Z"
              fill="currentColor"
              fill-rule="evenodd"
              clip-rule="evenodd"
            />
          </svg>
          <span class="boot-word">homecrm<span class="boot-dot">.</span></span>
        </div>
      </div>
    </div>
    <script>
      performance.mark("homecrm-splash-start");
    </script>
    <noscript><style>#boot-splash { display: none; }</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
