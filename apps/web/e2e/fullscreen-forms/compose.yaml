name: homecrm-test-ui-7-fullscreen-forms
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off, -c, max_locks_per_transaction=512]
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 1s
      timeout: 3s
      retries: 60
  playwright:
    image: ${HOMECRM_E2E_IMAGE:-homecrm-test-ui-7-fullscreen-forms:e2e-linux}
    build:
      context: ../../../..
      dockerfile: apps/web/e2e/Dockerfile
    init: true
    ipc: host
    working_dir: /workspace
    environment:
      HOMECRM_TEST_PG_ADMIN_URL: postgres://postgres@postgres:5432/postgres
      HOMECRM_E2E_SOURCE: /source
      UI7_PHASE: ${UI7_PHASE:-after}
    volumes:
      - ../../../..:/source:ro
      - ../../src:/workspace/apps/web/src:ro
      - ..:/workspace/apps/web/e2e:ro
      - ../../test-results:/workspace/apps/web/test-results
    depends_on:
      postgres:
        condition: service_healthy
