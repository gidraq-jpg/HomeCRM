packages:
  - apps/*
  - packages/*
  - tools/*

# Защита от свежих вредоносных версий: ставим только версии старше суток.
minimumReleaseAge: 1440

# Скрипты установки зависимостей не запускаются. esbuild (его тянет drizzle-kit) работает
# и без своего скрипта: готовая программа приходит отдельным пакетом под платформу.
allowBuilds:
  esbuild: false
